[package]
name = "derivative"
version = "2.2.0"
authors = ["mcarton <cartonmartin+git@gmail.com>"]
license = "MIT/Apache-2.0"
readme = "README.md"
documentation = "https://mcarton.github.io/rust-derivative/"
repository = "https://github.com/mcarton/rust-derivative"
description = "A set of alternative `derive` attributes for Rust"
keywords = ["derive", "macro", "macro1-1", "plugin"]
categories = ["rust-patterns"]
edition = '2018'

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["visit", "extra-traits"] }

[dev-dependencies]
runtime-macros-derive = "0.8.0"
trybuild = "1.0.110"
walkdir = "2"

[features]
use_core = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tarpaulin_include)'] }
